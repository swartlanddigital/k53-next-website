name: Deploy K53 Next website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://k53next.swartlanddigital.co.za
          NEXT_PUBLIC_BASE_PATH: ""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Submit updated public URLs
        env:
          INDEXNOW_KEY: 07420f44ae6b3746a69864e8e04e5a8d03ecb92e0bf334cbc820e3ce71108bf6
        run: |
          curl --fail-with-body -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "{\"host\":\"k53next.swartlanddigital.co.za\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"https://k53next.swartlanddigital.co.za/${INDEXNOW_KEY}.txt\",\"urlList\":[\"https://k53next.swartlanddigital.co.za/\",\"https://k53next.swartlanddigital.co.za/k53-test/\",\"https://k53next.swartlanddigital.co.za/computerised-learners-test/\",\"https://k53next.swartlanddigital.co.za/learner-licence-appointment/\",\"https://k53next.swartlanddigital.co.za/learners-licence-app/\",\"https://k53next.swartlanddigital.co.za/download/\",\"https://k53next.swartlanddigital.co.za/faq/\"]}"
